<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Kelas - SMPN 8 Bandar Lampung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen pb-10 text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white text-blue-800 rounded-full flex items-center justify-center font-bold text-lg shadow">
                    8
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Jurnal Kelas Digital</h1>
                    <p class="text-xs text-blue-200">SMP Negeri 8 Bandar Lampung</p>
                </div>
            </div>
            <span class="bg-blue-700 text-xs px-2.5 py-1 rounded-full font-medium border border-blue-600">
                Online
            </span>
        </div>
    </header>

    <!-- Main Form Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Card Informatif Tanggal -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex justify-between items-center text-sm">
            <div>
                <p class="text-slate-500 text-xs">Hari & Tanggal</p>
                <p class="font-semibold text-slate-700" id="currentDate"></p>
            </div>
            <div class="text-right">
                <p class="text-slate-500 text-xs">Database Status</p>
                <span class="inline-flex items-center gap-1 text-emerald-600 text-xs font-semibold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Google Sheets
                </span>
            </div>
        </div>

        <!-- Form Input Jurnal -->
        <form id="jurnalForm" onsubmit="simpanJurnal(event)" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 space-y-4">
            
            <h2 class="font-bold text-slate-800 text-sm border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-blue-600"></i> Pengisian KBM Harian
            </h2>

            <!-- 1. Kelas & Mapel -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas <span class="text-red-500">*</span></label>
                    <select id="kelas" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">-- Pilih Kelas --</option>
                        <optgroup label="Tingkat 7 (7A - 7I)">
                            <option value="7A">Kelas 7A</option>
                            <option value="7B">Kelas 7B</option>
                            <option value="7C">Kelas 7C</option>
                            <option value="7D">Kelas 7D</option>
                            <option value="7E">Kelas 7E</option>
                            <option value="7F">Kelas 7F</option>
                            <option value="7G">Kelas 7G</option>
                            <option value="7H">Kelas 7H</option>
                            <option value="7I">Kelas 7I</option>
                        </optgroup>
                        <optgroup label="Tingkat 8 (8A - 8J)">
                            <option value="8A">Kelas 8A</option>
                            <option value="8B">Kelas 8B</option>
                            <option value="8C">Kelas 8C</option>
                            <option value="8D">Kelas 8D</option>
                            <option value="8E">Kelas 8E</option>
                            <option value="8F">Kelas 8F</option>
                            <option value="8G">Kelas 8G</option>
                            <option value="8H">Kelas 8H</option>
                            <option value="8I">Kelas 8I</option>
                            <option value="8J">Kelas 8J</option>
                        </optgroup>
                        <optgroup label="Tingkat 9 (9A - 9I)">
                            <option value="9A">Kelas 9A</option>
                            <option value="9B">Kelas 9B</option>
                            <option value="9C">Kelas 9C</option>
                            <option value="9D">Kelas 9D</option>
                            <option value="9E">Kelas 9E</option>
                            <option value="9F">Kelas 9F</option>
                            <option value="9G">Kelas 9G</option>
                            <option value="9H">Kelas 9H</option>
                            <option value="9I">Kelas 9I</option>
                        </optgroup>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Mata Pelajaran <span class="text-red-500">*</span></label>
                    <select id="mapel" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">-- Pilih Mapel --</option>
                        <option value="Informatika">Informatika</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="IPA">IPA</option>
                        <option value="IPS">IPS</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="PPKn">PPKn</option>
                        <option value="PAI">PAI & Budi Pekerti</option>
                        <option value="PJOK">PJOK</option>
                        <option value="Seni Budaya">Seni Budaya</option>
                        <option value="Prakarya">Prakarya</option>
                    </select>
                </div>
            </div>

            <!-- 2. Jam Ke- -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Ke- <span class="text-red-500">*</span></label>
                <div class="grid grid-cols-2 gap-3">
                    <select id="jamMulai" required class="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Dari Jam</option>
                        <option value="1">Jam ke-1</option>
                        <option value="2">Jam ke-2</option>
                        <option value="3">Jam ke-3</option>
                        <option value="4">Jam ke-4</option>
                        <option value="5">Jam ke-5</option>
                        <option value="6">Jam ke-6</option>
                        <option value="7">Jam ke-7</option>
                        <option value="8">Jam ke-8</option>
                        <option value="9">Jam ke-9</option>
                        <option value="10">Jam ke-10</option>
                    </select>
                    <select id="jamSelesai" required class="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Sampai Jam</option>
                        <option value="1">Jam ke-1</option>
                        <option value="2">Jam ke-2</option>
                        <option value="3">Jam ke-3</option>
                        <option value="4">Jam ke-4</option>
                        <option value="5">Jam ke-5</option>
                        <option value="6">Jam ke-6</option>
                        <option value="7">Jam ke-7</option>
                        <option value="8">Jam ke-8</option>
                        <option value="9">Jam ke-9</option>
                        <option value="10">Jam ke-10</option>
                    </select>
                </div>
            </div>

            <!-- 3. Ringkasan Materi -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Ringkasan Materi / Aktivitas <span class="text-red-500">*</span></label>
                <textarea id="materi" required rows="3" placeholder="Contoh: Pengenalan Algoritma dan Pemrograman Sederhana." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
            </div>

            <!-- 4. Absensi Ketidakhadiran -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-600">Siswa Tidak Hadir (Opsional)</label>
                    <button type="button" onclick="tambahSiswaAbsen()" class="text-xs text-blue-700 hover:text-blue-800 font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-plus-circle"></i> Tambah Siswa
                    </button>
                </div>
                <div id="containerAbsen" class="space-y-2"></div>
            </div>

            <!-- 5. Catatan Perilaku -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Perilaku / Kejadian Khusus</label>
                <input id="catatan" type="text" placeholder="Contoh: Diskusi kelompok berjalan sangat kondusif." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- 6. Tanda Tangan Virtual -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-600">Tanda Tangan Guru <span class="text-red-500">*</span></label>
                    <button type="button" onclick="clearSignature()" class="text-xs text-red-500 hover:underline">Hapus / Reset</button>
                </div>
                <div class="border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 relative overflow-hidden">
                    <canvas id="signatureCanvas" class="w-full h-32 touch-none cursor-crosshair"></canvas>
                    <p id="placeholderTtd" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none">
                        Goreskan Tanda Tangan Di Sini
                    </p>
                </div>
            </div>

            <!-- Tombol Submit -->
            <button id="btnSubmit" type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg text-xs shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Simpan & Kirim ke Google Sheets
            </button>

        </form>

        <!-- Pesan Berhasil -->
        <div id="alertSuccess" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-4 text-center text-xs space-y-2">
            <i class="fa-solid fa-circle-check text-2xl text-emerald-500"></i>
            <p class="font-bold">Jurnal Berhasil Disimpan ke Google Sheets!</p>
            <p class="text-slate-600">Data KBM dan Tanda Tangan Virtual telah terkirim ke database sekolah.</p>
            <button onclick="resetForm()" class="bg-emerald-600 text-white px-4 py-1.5 rounded-lg text-xs font-semibold">Isi Jurnal Lagi</button>
        </div>

    </main>

    <script>
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('id-ID', options);

        const canvas = document.getElementById('signatureCanvas');
        const signaturePad = new SignaturePad(canvas, { penColor: 'rgb(30, 58, 138)' });

        function resizeCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            signaturePad.clear();
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        signaturePad.addEventListener("beginStroke", () => {
            document.getElementById('placeholderTtd').classList.add('hidden');
        });

        function clearSignature() {
            signaturePad.clear();
            document.getElementById('placeholderTtd').classList.remove('hidden');
        }

        function tambahSiswaAbsen() {
            const container = document.getElementById('containerAbsen');
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center bg-slate-50 p-2 rounded-lg border border-slate-200 item-absen';
            div.innerHTML = `
                <input type="text" placeholder="Nama Siswa" class="nama-siswa flex-1 bg-white border border-slate-300 rounded p-1.5 text-xs outline-none">
                <select class="status-absen bg-white border border-slate-300 rounded p-1.5 text-xs outline-none">
                    <option value="(S)">Sakit (S)</option>
                    <option value="(I)">Izin (I)</option>
                    <option value="(A)">Alpha (A)</option>
                </select>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 p-1">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        }

        async function simpanJurnal(e) {
            e.preventDefault();
            if (signaturePad.isEmpty()) {
                alert("Mohon lengkapi Tanda Tangan Virtual terlebih dahulu!");
                return;
            }

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Mengirim Data...`;

            let daftarAbsen = [];
            document.querySelectorAll('.item-absen').forEach(item => {
                const nama = item.querySelector('.nama-siswa').value;
                const status = item.querySelector('.status-absen').value;
                if(nama) daftarAbsen.push(`${nama} ${status}`);
            });

            // GANTI DENGAN URL APPS SCRIPT ANDA YANG BERAKHIRAN /exec
            const scriptURL = 'MASUKKAN_URL_EXEC_DI_SINI'; 

            const payload = {
                kelas: document.getElementById('kelas').value,
                mapel: document.getElementById('mapel').value,
                jamKe: `Jam ${document.getElementById('jamMulai').value} - ${document.getElementById('jamSelesai').value}`,
                materi: document.getElementById('materi').value,
                siswaAbsen: daftarAbsen.join(', ') || 'Nihil (Hadir Semua)',
                catatan: document.getElementById('catatan').value || '-',
                tandaTangan: signaturePad.toDataURL()
            };

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('jurnalForm').classList.add('hidden');
                document.getElementById('alertSuccess').classList.remove('hidden');
            } catch (error) {
                alert("Gagal mengirim data. Pastikan koneksi internet aktif.");
                console.error('Error!', error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Simpan & Kirim ke Google Sheets`;
            }
        }

        function resetForm() {
            document.getElementById('jurnalForm').reset();
            clearSignature();
            document.getElementById('containerAbsen').innerHTML = '';
            document.getElementById('jurnalForm').classList.remove('hidden');
            document.getElementById('alertSuccess').classList.add('hidden');
        }
    </script>
</body>
</html>
